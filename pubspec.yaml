name: yoldashmoto
description: YoldashMoto — nobody gets left alone on the road. SOS, mechanics, tow, marketplace. Flutter + Supabase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  sensors_plus: ^6.1.1
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  uuid: ^4.5.1
  intl: ^0.20.3
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  connectivity_plus: ^6.1.4
  vibration: ^2.0.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
